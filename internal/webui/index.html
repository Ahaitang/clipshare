<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clipshare · 剪贴板历史</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#171a1f; --dim:#69707c; --line:#e4e7eb;
  --accent:#2f6df6; --danger:#c0342b; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171b; --panel:#1c1f25; --ink:#e7e9ed; --dim:#98a0ab; --line:#2a2e36; --accent:#7aa5ff; --danger:#ff7168}
}
*{box-sizing:border-box}
body{ margin:0; padding:28px 20px 64px; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font-size:17px;letter-spacing:-.01em}
.brand .sub{color:var(--dim);font-size:13px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=search]{width:240px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.count{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;min-width:56px}
button{font:inherit;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.5;cursor:default}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
button.primary{background:var(--danger);border-color:var(--danger);color:#fff}
button.copy{font-size:12px;padding:5px 10px;white-space:nowrap;align-self:start}
.confirm{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:11px 14px;font-size:13px;
  border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--danger) 8%,var(--panel));
}
.confirm .spacer{margin-left:auto}
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
}
.row:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tag{
  align-self:start;display:inline-block;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
}
.tag.remote{background:color-mix(in srgb,var(--dim) 16%,transparent);color:var(--dim)}
.content{
  margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:6.2em;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent);
}
.empty{padding:56px 16px;text-align:center;color:var(--dim);font-size:13px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;padding:9px 16px;border-radius:999px;
  font-size:13px;color:#fff;background:#2b3038;box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.toast.bad{background:var(--danger)}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  input[type=search],.tools{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>clipshare</h1><span class="sub">本机剪贴板历史</span></div>
    <div class="tools">
      <input id="q" type="search" placeholder="搜索内容或来源…" autocomplete="off" spellcheck="false" aria-label="搜索历史">
      <span id="count" class="count"></span>
      <button id="refresh" type="button" title="重新读取（快捷键 /）">刷新</button>
      <button id="restart" type="button" title="重启 clipshare（重新加载配置、重新注册快捷键）">重启</button>
      <button id="clear" type="button" class="danger">清空历史</button>
    </div>
  </div>

  <div id="confirm" class="confirm" hidden>
    <span>确定清空全部历史？只删本地记录，不影响已复制的内容，也不会同步给其他设备。</span>
    <span class="spacer"></span>
    <button id="cancel" type="button">取消</button>
    <button id="confirmClear" type="button" class="primary">确认清空</button>
  </div>

  <main id="list" class="list" aria-live="polite"></main>
  <p id="empty" class="empty" hidden></p>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const state = { entries: [], q: '' };

const api = {
  async entries() {
    const r = await fetch('/ui/api/entries', { cache: 'no-store' });
    if (!r.ok) throw new Error('读取历史失败：HTTP ' + r.status);
    const list = await r.json();
    return Array.isArray(list) ? list : [];
  },
  async pull(id) {
    const r = await fetch('/ui/api/pull', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }),
    });
    if (!r.ok) throw new Error(await message(r, '取回失败'));
  },
  async clear() {
    const r = await fetch('/ui/api/clear', { method: 'POST' });
    if (!r.ok) throw new Error(await message(r, '清空失败'));
  },
  async restart() {
    const r = await fetch('/ui/api/restart', { method: 'POST' });
    if (!r.ok) throw new Error(await message(r, '重启失败'));
  },
};

async function message(r, fallback) {
  try {
    const data = await r.json();
    if (data && data.error) return fallback + '：' + data.error;
  } catch (e) { /* 响应不是 JSON */ }
  return fallback + '：HTTP ' + r.status;
}

function label(e) {
  if (!e.origin) return '本机';
  return e.originName || '远端';
}

function fmt(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  const hms = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  if (d.toDateString() === new Date().toDateString()) return hms;
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + hms;
}

function matches(e, q) {
  if (!q) return true;
  return (label(e) + '\n' + e.content).toLowerCase().includes(q);
}

function buildRow(e) {
  const row = document.createElement('article');
  row.className = 'row';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const time = document.createElement('time');
  time.textContent = fmt(e.recvAt);
  time.dateTime = e.recvAt;
  const tag = document.createElement('span');
  tag.className = 'tag' + (e.origin ? ' remote' : '');
  tag.textContent = label(e);
  meta.append(time, tag);
  const body = document.createElement('pre');
  body.className = 'content';
  body.textContent = e.content.length > 4000 ? e.content.slice(0, 4000) + '\n…' : e.content;
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'copy';
  copy.textContent = '复制到本机';
  copy.addEventListener('click', () => pull(e.id, copy));
  row.append(meta, body, copy);
  return row;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const list = state.entries.filter((e) => matches(e, q));
  $('#list').replaceChildren(...list.map(buildRow));
  const empty = $('#empty');
  if (!state.entries.length) {
    empty.textContent = '还没有历史记录。复制一段文字，或等待其他设备同步过来。';
  } else if (!list.length) {
    empty.textContent = '没有匹配「' + state.q.trim() + '」的条目。';
  }
  empty.hidden = list.length > 0;
  $('#count').textContent = state.entries.length ? list.length + ' / ' + state.entries.length + ' 条' : '';
}

async function pull(id, btn) {
  const text = btn.textContent;
  btn.disabled = true;
  try {
    await api.pull(id);
    btn.textContent = '已复制';
    toast('已复制到本机剪贴板');
    setTimeout(() => { btn.textContent = text; btn.disabled = false; }, 1400);
  } catch (err) {
    btn.disabled = false;
    toast(err.message, true);
  }
}

async function load() {
  try {
    const list = await api.entries();
    list.sort((a, b) => new Date(b.recvAt) - new Date(a.recvAt));
    state.entries = list;
    render();
  } catch (err) {
    toast(err.message, true);
  }
}

let toastTimer;
function toast(msg, bad) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('bad', !!bad);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

$('#q').addEventListener('input', (ev) => { state.q = ev.target.value; render(); });
$('#restart').addEventListener('click', async () => {
  $('#restart').disabled = true;
  try {
    await api.restart();
    toast('正在重启，稍候自动刷新…');
    // 重启期间页面会短暂连不上；给它 ~2.5s 再自动刷新，省得用户以为坏了
    setTimeout(() => location.reload(), 2500);
  } catch (e) {
    $('#restart').disabled = false;
    toast(e.message, true);
  }
});

$('#refresh').addEventListener('click', load);
$('#clear').addEventListener('click', () => { $('#confirm').hidden = false; $('#clear').disabled = true; });
$('#cancel').addEventListener('click', () => { $('#confirm').hidden = true; $('#clear').disabled = false; });
$('#confirmClear').addEventListener('click', async () => {
  const btn = $('#confirmClear');
  btn.disabled = true;
  try {
    await api.clear();
    state.entries = [];
    render();
    toast('历史已清空');
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    $('#confirm').hidden = true;
    $('#clear').disabled = false;
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === '/' && document.activeElement !== $('#q')) {
    ev.preventDefault();
    $('#q').focus();
  } else if (ev.key === 'Escape' && (document.activeElement === $('#q') || ev.target === $('#q'))) {
    $('#q').value = '';
    state.q = '';
    render();
    $('#q').blur();
  }
});

setInterval(() => { if (!document.hidden) load(); }, 4000);
load();
</script>
</body>
</html>
